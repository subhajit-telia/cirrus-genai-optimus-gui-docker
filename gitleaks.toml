# Added by Telia 2025-12-07
[[rules]]
id = "oracle-ado-connection-string"
description = "Oracle/ADO.NET/SQL Server connection string with password"
regex = '''(?i)(User\s+Id|UID|Server|Data\s+Source)[^;]{0,100};[^;]{0,100}(Password|Pwd)\s*=\s*([^;'"&\s]{3,})'''
secretGroup = 3
tags = ["oracle", "ado.net", "sqlserver", "connection-string", "password"]
keywords = ["Password", "Pwd", "User Id", "Data Source", "Server"]

[rules.allowlist]
regexTarget = "match"
regexes = [
    # Exclude function calls that retrieve passwords - these are not hardcoded secrets
    # Matches patterns where password/pwd is assigned to a retrieval function call
    # Example match: "ServerUserName\");\n        this.m_web_service_password = Utils.getParam("
    # Pattern: ends with get<Something>( where Something is one or more letters
    '''get[A-Za-z]+\($''',
    # Pattern: ends with get() - simple getter with no suffix
    '''get\($''',
    # Pattern: ends with lookup<Something>( or lookup()
    '''lookup[A-Za-z]*\($''',
    # Exclude setter/getter method definitions
    # Example match: "ServerUserName(String dmlServerUserName) {\n\t\tthis.dmlServerUserName = dmlServerUserName;\n\t}\n\n\tpublic void setDmlServerPassword(String dmlServe..."
    # Pattern: matches setter methods like setPassword(String password) or setDmlServerPassword(String dmlServerPassword)
    '''(?i)set[A-Za-z]*password\s*\(\s*String\s+[a-zA-Z][a-zA-Z0-9_]*\s*\)''',
    # Exclude template variable interpolations
    # Example: f"uid={MSSQL_USERNAME}; pwd={MSSQL_PASSWORD};" or "password={PASSWORD}"
    # Pattern: matches {VARIABLE_NAME} style interpolations
    '''(?i)(password|pwd)\s*=\s*\{[A-Z_][A-Z0-9_]*\}''',
    # Exclude Perl/PHP/Ruby variable dereference patterns
    # Example: $password = $password->{'host'}; or $pwd = $server->{'password'};
    # Pattern: matches $variable-> which is object/hash access, not a hardcoded secret
    '''\$[a-zA-Z_][a-zA-Z0-9_]*->''',
    # Exclude method calls with dot notation
    # Example: adminPassword = configServerSettings.getAdminPassword();
    # Example: password = UUID.randomUUID().toString();
    # Pattern: matches .methodName( which indicates a method call, not a hardcoded secret
    '''\.[a-zA-Z_][a-zA-Z0-9_]*\(''',
]

# Override aws-access-access_token rule to exclude Finnish words that start with ASIA
[[rules]]
id = "aws-access-access_token"
description = "Identified a pattern that may indicate AWS credentials, risking unauthorized cloud resource access and data breaches on AWS platforms."

[rules.allowlist]
stopwords = [
    # Finnish words that start with ASIA and get falsely detected
    "ASIANTUNT",
    "ASIAKASPA",
]
