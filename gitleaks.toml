# Gitleaks configuration for dt-secrets-scanning-global
# This configuration includes allowlists to reduce false positives from the generic-api-key rule
title = "Telia Custom"

[extend]
useDefault = true

disabledRules = ["atlassian-api-access_token", "nytimes-access-access_token"]

[[allowlists]]
description = "Global allowlist to reduce false positives"
# NOTE: 'paths' will NOT work in global allowlists as long as 'useDefault' is enabled above.
# paths = [
#     '''.*example.*''',
# ]

stopwords = [
    # Common function/method names
    "GeneratePassword",
    "GetPassword",
    "CreatePassword",
    "FetchPassword",
    "RetrievePassword",
    "BuildPassword",
    "MakePassword",
    "LoadPassword",
    "ReadPassword",
    "SetPassword",
    "UpdatePassword",
    "ChangePassword",
    "ResetPassword",
    "HashPassword",
    "EncryptPassword",
    "DecryptPassword",
    "ValidatePassword",
    "CheckPassword",
    # Common variable patterns
    "userPassword",
    "dbPassword",
    "adminPassword",
    "defaultPassword",
    "newPassword",
    "oldPassword",
    "tempPassword",
    "currentPassword",
    # Template/placeholder patterns
    "PASSWORD",
    "YOUR_PASSWORD",
    "PLACEHOLDER",
]
regexes = [
    '''(?i)HID\d{9,}(-[\w-]+)?''',
    '''(?i)accessType''',
    # Other encrypted content patterns
    '''-----BEGIN PGP MESSAGE-----''',
    '''-----BEGIN AGE ENCRYPTED FILE-----''',
    '''ENC\[AES256_GCM,data:[^,]+,iv:[^,]+,tag:[^\]]+\]''',
    '''U2FsdGVkX1[A-Za-z0-9+/]+=*''',  # OpenSSL encrypted data (base64 encoded "Salted__" prefix)
    '''(?i)encrypted[_-]?(?:secret|key|password|access_token|credential)s?[:=]\s*["'][^"']+["']''',
    # Template variables (e.g., ${{ secrets.PASSWORD }}, ${PASSWORD}, $PASSWORD)
    '''(?i)(pass(word)?|pwd|passcode)\s*[:=]\s*\$''',
    # Environment variable API calls
    '''(?i)(pass(word)?|pwd|passcode)\s*[:=]\s*(process\.env|os\.getenv|System\.getenv|ENV\[)''',
    # Any identifier (camelCase, PascalCase, snake_case starting with letter)
    '''(?i)(pass(word)?|pwd|passcode)\s*[:=]\s*[a-zA-Z][a-zA-Z0-9_]*\b''',
]

# Override the default private-key rule to exclude encrypted keys
[[rules]]
id = "private-key"
description = "Identified a Private Key, which may compromise cryptographic security and sensitive data encryption."
regex = '''(?i)-----BEGIN[ A-Z0-9_-]{0,100}PRIVATE KEY(?: BLOCK)?-----[\s\S]{64,}?-----END[ A-Z0-9_-]{0,100}PRIVATE KEY(?: BLOCK)?-----'''
keywords = ["-----begin"]

[rules.allowlist]
regexTarget = "match"
regexes = [
    # Exclude encrypted private keys - these are safe
    '''(?i)-----BEGIN[ A-Z0-9_-]*PRIVATE[ ]+KEY-----[\s\S]*?Proc-Type:[ ]*4,[ ]*ENCRYPTED[\s\S]*?-----END[ A-Z0-9_-]*PRIVATE[ ]+KEY-----''',
    '''(?i)-----BEGIN[ ]+ENCRYPTED[ ]+PRIVATE[ ]+KEY-----[\s\S]{64,}?-----END[ ]+ENCRYPTED[ ]+PRIVATE[ ]+KEY-----''',
]

[[rules]]
id = "generic-api-key"
description = "Detected a Generic API Key, potentially exposing access to various services and sensitive operations."
telia_note = "Raising entropy threshold, dropping 'key'-like matches, and excluding identifiers named 'accessType' (via negative lookahead in regex) to reduce false positives."
#entropy = 3.5
entropy = 4.0
# regex = '''(?i)[\w.-]{0,50}?(?:access|auth|(?-i:[Aa]pi|API)|credential|creds|key|passw(?:or)?d|secret|access_token)(?:[ \t\w.-]{0,20})[\s'"]{0,3}(?:=|>|:{1,3}=|\|\||:|=>|\?=|,)[\x60'"\s=]{0,5}([\w.=-]{10,150}|[a-z0-9][a-z0-9+/]{11,}={0,3})(?:[\x60'"\s;]|\\[nr]|$)'''
regex = '''(?i)[\w.-]{0,50}?(?:access|auth|(?-i:[Aa]pi|API)|credential|creds|passw(?:or)?d|secret|access_token)(?:[ \t\w.-]{0,20})[\s'"]{0,3}(?:=|>|:{1,3}=|\|\||:|=>|\?=|,)[\x60'"\s=]{0,5}([\w.=-]{10,150}|[a-z0-9][a-z0-9+/]{11,}={0,3})(?:[\x60'"\s;]|\\[nr]|$)'''
keywords = [
    "access",
    "api",
    "auth",
    #"key",
    "credential",
    "creds",
    "passwd",
    "password",
    "secret",
    "access_token",
]

[rules.allowlist]
regexTarget = "match"
regexes = [
    '''(?i)accessType\s*[=:]''',
    '''(?i)SecretFileName''',
    '''(?i)clientToken:\s*["']pub''',
    '''(?i)HID\d{9,}(-[\w-]+)?''',
    '''(?i)(apigee|apimarket)(_id)?''',
    '''SetAuthOnly''',
    # Telia service identifiers - these are service names, not secrets
    # Broader pattern for telia service identifiers (case-insensitive)
    '''(?i)telia-[A-Za-z0-9_-]*API[A-Za-z0-9_-]*[-_]v\d+''',
    # Skip secrets containing 'telia' after delimiters (case-insensitive)
    '''[:=]\s*["']?[^"']*(?i:telia)[^"']*["']?''',
    # Base64 encoded URLs and configuration - these are configuration values, not secrets
    '''base64_api:''',
    '''base64_api_quoted:''',
    '''base64_endpoint:''',
    # Vlocity/Salesforce TokenSymbol configuration items - these are metadata, not secrets
    '''__TokenSymbol__c["']?\s*:\s*["'][^"']+["']?''',
    # Exclude EncryptedPassword configuration values - these are encrypted, not plaintext secrets
    '''(?i)EncryptedPassword["']?\s*[:=]\s*["']?''',
    # Encrypted content patterns - these are properly encrypted and acceptable
    '''-----BEGIN PGP MESSAGE-----[\s\S]*?-----END PGP MESSAGE-----''',
    '''-----BEGIN AGE ENCRYPTED FILE-----[\s\S]*?-----END AGE ENCRYPTED FILE-----''',
    '''ENC\[AES256_GCM,data:[^,]+,iv:[^,]+,tag:[^\]]+\]''',
    '''U2FsdGVkX1[A-Za-z0-9+/]+=*''',  # OpenSSL encrypted data (base64 encoded "Salted__" prefix)
    '''(?i)encrypted[_-]?(?:secret|key|password|access_token|credential)s?[:=]\s*["'][^"']{20,}["']''',
]
paths = [
    '''.*/vods/.*''',
    '''.*\.md$''',
    '''.*\.rst$''',
    '''.*\.adoc$''',
    '''.*\.resx$''',
    '''(?i)readme(\.[^/]*)?$''',
    # Salesforce sample input files containing test JWTs
    '''.*SampleInput\.json$''',
    '''tests/.*''',
    # Teliasaurus has __mocks__:
    '''.*__mocks__/.*''',
]


[[rules]]
id = "vault-service-access_token"
description = "Identified a Vault Service Token, potentially compromising infrastructure security and access to sensitive credentials."
telia_note = "raising entropy threshold, dropping 'key'-like matches - a compromise to reduce false positives"
entropy = 4.0

[rules.allowlist]
regexTarget = "match"
regexes = [
    # Salesforce property assignments in test files - these are not vault access_tokens
    '''s\.[A-Za-z][A-Za-z0-9_]*\d*\s*=''',
]
paths = [
    '''.*\.md$''',
    '''.*\.rst$''',
    '''.*\.adoc$''',
    '''.*\.resx$''',
    '''(?i)readme(\.[^/]*)?$''',
    '''.*SampleInput\.json$''',
    '''.*__mocks__/.*''',
]

[[rules]]
id = "dropbox-api-access_token"
entropy = 3.4
telia_note = "raising entropy threshold, especially to reduce false positives on https://github.com/telia-company/uc-servicehub-mi-autotests"

[rules.allowlist]
paths = [
    '''.*\.md$''',
    '''.*\.rst$''',
    '''.*\.adoc$''',
    '''.*\.resx$''',
    '''(?i)readme(\.[^/]*)?$''',
    '''.*SampleInput\.json$''',
    '''.*__mocks__/.*''',
]


[[rules]]
id = "curl-auth-user"
description = "Discovered a potential basic authorization access_token provided in a curl command, which could compromise the curl accessed resource."
regex = '''\bcurl\b(?:.*|.*(?:[\r\n]{1,2}.*){1,5})[ \t\n\r](?:-u|--user)(?:=|[ \t]{0,5})("(:[^"]{3,}|[^:"]{3,}:|[^:"]{3,}:[^"]{3,})"|'([^:']{3,}:[^']{3,})'|((?:"[^"]{3,}"|'[^']{3,}'|[\w$@.-]+):(?:"[^"]{3,}"|'[^']{3,}'|[\w${}@.-]+)))(?:\s|\z)'''
entropy = 2
keywords = ["curl"]
[rules.allowlist]
regexes = [
    '''[^:]+:(?:change(?:it|me)|pass(?:word)?|pwd|test|access_token|\*+|x+)''',
    '''['"]?<[^>]+>['"]?:['"]?<[^>]+>|<[^:]+:[^>]+>['"]?''',
    '''[^:]+:\[[^]]+]''',
    '''['"]?[^:]+['"]?:['"]?\$(?:\d|\w+|\{(?:\d|\w+)})['"]?''',
    '''\$\([^)]+\):\$\([^)]+\)''',
    '''['"]?\$?{{[^}]+}}['"]?:['"]?\$?{{[^}]+}}['"]?''',
    # following line added for customization, e.g. for (already archived):
    # https://github.com/telia-company/event-manager-shared-contract-tests/blob/b1aee223f3a4e2e3a697ef268729e5aa50d3ccc2/.github/workflows/run-test-with-environment.yml#L32
    '''[^:]+:\$?{{[^}]+}}''',
]
paths = [
    '''.*\.md$''',
    '''.*\.rst$''',
    '''.*\.adoc$''',
    '''.*\.resx$''',
    '''(?i)readme(\.[^/]*)?$''',
    '''.*SampleInput\.json$''',
    '''.*__mocks__/.*''',
]

[[rules]]
id = "jfrog-identity-access_token"
description = "Detects a JFrog identity access_token, risking unauthorized access to JFrog services."
entropy = 3.9
telia_note = "Overriding entropy threshold to 3.9 to reduce false positives"

[rules.allowlist]
paths = [
    '''.*\.md$''',
    '''.*\.rst$''',
    '''.*\.adoc$''',
    '''.*\.resx$''',
    '''(?i)readme(\.[^/]*)?$''',
