[[rules]]
id = "jwt"
description = "Identified a JSON Web Token, which may lead to unauthorized access to web applications and sensitive user data."
telia_note = "Override JWT rule to include global allowlists and exclude __mocks__ folders"

[rules.allowlist]
regexTarget = "match"
regexes = [
    # Include global allowlist patterns
    '''(?i)HID\d{9,}(-[\w-]+)?''',
    '''(?i)accessType''',
    '''-----BEGIN PGP MESSAGE-----''',
    '''-----BEGIN AGE ENCRYPTED FILE-----''',
    '''ENC\[AES256_GCM,data:[^,]+,iv:[^,]+,tag:[^\]]+\]''',
    # Base64 prefix that says "Salted_" in plaintext
    '''U2FsdGVkX1[A-Za-z0-9+/]+=*''',
    '''(?i)encrypted[_-]?(?:secret|key|password|access_token|credential)s?[:=]\s*["'][^"']+["']''',
]
paths = [
    '''.*\.md$''',
    '''.*\.rst$''',
    '''.*\.adoc$''',
    '''.*\.resx$''',
    '''(?i)readme(\.[^/]*)?$''',
    '''.*SampleInput\.json$''',
    '''tests/.*''',
    '''.*__mocks__/.*''',
    '''.*/vods/.*''',
]

