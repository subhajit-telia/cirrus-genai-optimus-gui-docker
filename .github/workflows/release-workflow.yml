name: Release Time

on:
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  release:
    uses: telia-company/devx-cicd-workflows-and-actions/.github/workflows/release.yml@main
    with:
      releaseType: simple
      applicationId: "911884"
    secrets:
      releaseAppKey: ${{ secrets.AI_RELEASE_APP_KEY }}
