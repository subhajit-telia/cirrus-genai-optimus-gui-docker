apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: ai-optimus-gui-genai-app
  namespace: default  # Update this to your deployment namespace
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "stallions/optimus_prime_se/webapp"
        objectType: "secretsmanager"
        objectAlias: "secrets.json"
---
# Optional: If you're using Kubernetes native secrets in addition to CSI
apiVersion: v1
kind: Secret
metadata:
  name: ai-optimus-gui-secrets
  namespace: default  # Update this to your deployment namespace
type: Opaque
stringData:
  # These values will be fetched from AWS Secrets Manager
  # You can also reference them directly in the SecretProviderClass above
  api_endpoint: ""  # Will be overridden by CSI driver or environment
  api_key: ""
  azure_ad_client_id: ""
  azure_ad_tenant_id: ""
  azure_ad_client_secret: ""
  react_app_url: ""
