replicaCount: 2

image:
  repository: "cirrus-docker.jfrog.teliacompany.io/genai/ai-optimus-gui"
  pullPolicy: IfNotPresent

# ============================================
# ENVIRONMENT VARIABLES - CRITICAL FOR DEPLOYMENT
# ============================================
env:
  AZURE_CLIENT_ID: ""
  AZURE_TENANT_ID: ""
  API_ENDPOINT: ""
  API_KEY: ""
  REACT_APP_ENV: "production"
  REACT_APP_API_URL: "/api"

deployment:
  ports:
    - name: http
      containerPort: 80
      protocol: TCP
  livenessProbe:
    httpGet:
      path: /
      port: 80
  readinessProbe:
    httpGet:
      path: /
      port: 80
    initialDelaySeconds: 10
  serviceAccountName: "deployment"
  volumeMounts:
    - name: secrets-store
      mountPath: "/mnt/secrets"
      readOnly: true
  volumes:
    - csi:
        driver: secrets-store.csi.k8s.io
        readOnly: true
        volumeAttributes:
          secretProviderClass: ai-optimus-gui-genai-app
      name: secrets-store

service:
  port: 80

# Add default empty values for resources if needed
resources: {}
podAnnotations: {}
podSecurityContext: {}
securityContext: {}
imagePullSecrets: []
nodeSelector: {}
affinity: {}
tolerations: {}
autoscaling:
  enabled: false