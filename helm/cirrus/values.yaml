replicaCount: 2

image:
  repository: "cirrus-docker.jfrog.teliacompany.io/genai/ai-optimus-gui"
  pullPolicy: IfNotPresent

deployment:
  ports:
    - name: http
      containerPort: 80
      protocol: TCP
  livenessProbe:
    httpGet:
      path: /
      port: 80
  readinessProbe:
    httpGet:
      path: /
      port: 80
    initialDelaySeconds: 10
  serviceAccountName: "execution"
  # Environment variables - can be overridden per environment
  env:
    - name: API_ENDPOINT
      valueFrom:
        secretKeyRef:
          name: ai-optimus-gui-secrets
          key: api_endpoint
    - name: API_KEY
      valueFrom:
        secretKeyRef:
          name: ai-optimus-gui-secrets
          key: api_key
    - name: AZURE_AD_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: ai-optimus-gui-secrets
          key: azure_ad_client_id
    - name: AZURE_AD_TENANT_ID
      valueFrom:
        secretKeyRef:
          name: ai-optimus-gui-secrets
          key: azure_ad_tenant_id
    - name: AZURE_AD_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: ai-optimus-gui-secrets
          key: azure_ad_client_secret
    - name: REACT_APP_URL
      valueFrom:
        secretKeyRef:
          name: ai-optimus-gui-secrets
          key: react_app_url
  volumeMounts:
    - name: secrets-store
      mountPath: "/mnt/secrets"
      readOnly: true
  volumes:
    - csi:
        driver: secrets-store.csi.k8s.io
        readOnly: true
        volumeAttributes:
          secretProviderClass: ai-optimus-gui-genai-app
      name: secrets-store

service:
  port: 80